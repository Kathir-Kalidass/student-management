---
# Ansible Playbook: Deploy Student Management System
# Target: Remote Linux server (Ubuntu/Debian)
# Configurable via inventory.ini

- name: Deploy Student Management Application
  hosts: remote_servers
  vars:
    app_jar: student-management.jar
    app_name: student-management
    app_port: 8080
    # deploy_dir is set in inventory.ini (allows per-environment config)

  tasks:
    - name: Verify Java is installed (Java availability check)
      command: java -version
      register: java_version
      ignore_errors: yes
      changed_when: false

    - name: Print Java availability
      debug:
        msg: "Java runtime available on managed node"

    - name: Create application directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: '0755'

    - name: Stop existing application instance
      shell: |
        pkill -f "{{ app_jar }}" || true
        sleep 2
      ignore_errors: yes
      changed_when: false

    - name: Copy JAR file to managed node
      copy:
        src: "{{ playbook_dir }}/../target/{{ app_jar }}"
        dest: "{{ deploy_dir }}/{{ app_jar }}"
        mode: '0755'

    - name: Verify JAR file was copied
      stat:
        path: "{{ deploy_dir }}/{{ app_jar }}"
      register: jar_stat

    - name: Fail if JAR not found
      fail:
        msg: "JAR file not found at {{ deploy_dir }}/{{ app_jar }}"
      when: not jar_stat.stat.exists

    - name: Start the application in background
      shell: |
        nohup java -jar "{{ deploy_dir }}/{{ app_jar }}" > "{{ deploy_dir }}/app.log" 2>&1 &
        echo $! > "{{ deploy_dir }}/app.pid"
      args:
        chdir: "{{ deploy_dir }}"
      ignore_errors: no

    - name: Wait for application to start (up to 30s)
      wait_for:
        path: "{{ deploy_dir }}/app.pid"
        timeout: 30
        state: present

    - name: Verify application process is running
      shell: pgrep -af "{{ app_jar }}"
      register: process_check
      ignore_errors: yes
      changed_when: false

    - name: Show application process
      debug:
        msg: "{{ process_check.stdout_lines }}"

    - name: Check application log for success message
      shell: tail -n 30 "{{ deploy_dir }}/app.log"
      register: app_log
      changed_when: false

    - name: Show application output
      debug:
        msg: "{{ app_log.stdout_lines }}"

    - name: Display deployment summary
      debug:
        msg:
          - "========================================="
          - "  DEPLOYMENT SUCCESSFUL!"
          - "  Application: {{ app_name }}"
          - "  Deployed to: {{ deploy_dir }}"
          - "  Running on:  {{ inventory_hostname }}"
          - "========================================="
