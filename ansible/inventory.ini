[remote_servers]
student-app ansible_host=<REMOTE_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/student-app-key

[remote_servers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_connection=ssh
deploy_dir=/opt/student-management
app_jar=student-management.jar
app_port=8080
app_name=student-management
